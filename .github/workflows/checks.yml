name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: 1
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:3172
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY: ci-placeholder-not-a-secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: npm install --global pnpm@10.26.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm exec next typegen
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps --only-shell chromium webkit
      - name: Browser regression tests (isolated fixtures)
        run: |
          pnpm test:e2e --workers=1 --browser=chromium --output=test-results/chromium
          pnpm test:e2e --workers=1 --browser=webkit --output=test-results/webkit
        env:
          LUMEN_E2E_BASE_URL: http://127.0.0.1:3171
          LUMEN_E2E_START_SERVER: '1'
      - name: Upload failed browser traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-traces
          path: test-results/**/trace.zip
          if-no-files-found: ignore
          retention-days: 7
