name: Disposable staging

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main, 'codex/staging-*']

permissions:
  contents: read

concurrency:
  group: staging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-flow:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: npm install --global pnpm@10.26.0
      - run: pnpm install --frozen-lockfile
      - name: Install verified Supabase CLI
        run: |
          curl --fail --location --retry 3 https://github.com/supabase/cli/releases/download/v3.2.0/supabase_3.2.0_linux_amd64.tar.gz --output "$RUNNER_TEMP/supabase.tar.gz"
          printf 'fb88b175a817563505be02c60872060bcb8d5c869a1aa5656eaeb085d4a2f1e4  %s\n' "$RUNNER_TEMP/supabase.tar.gz" | sha256sum --check
          mkdir "$RUNNER_TEMP/supabase-bin"
          tar -xzf "$RUNNER_TEMP/supabase.tar.gz" -C "$RUNNER_TEMP/supabase-bin"
          echo "$RUNNER_TEMP/supabase-bin" >> "$GITHUB_PATH"
      - name: Prepare empty staging schema
        run: node scripts/staging/prepare-project.mjs
      - name: Start isolated Auth, PostgreSQL and Storage
        timeout-minutes: 15
        run: |
          if ! supabase start --workdir "$RUNNER_TEMP/lumen-staging" --exclude realtime,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor > "$RUNNER_TEMP/lumen-staging-start.log" 2>&1; then
            docker ps --format 'table {{.Names}}\t{{.Status}}'
            echo 'Supabase startup failed. Private startup logs are not published.'
            exit 1
          fi
      - name: Provision disposable test accounts
        run: node scripts/staging/provision-accounts.mjs
      - name: Start browser server
        run: |
          docker run --detach --rm --name lumen-staging-browsers --network host --ipc=host mcr.microsoft.com/playwright:v1.65.0-noble@sha256:9beb546099e11f52d62e505537914870e01a67e0e6b00ae41da4775324e73dbe sh -c 'npx --yes playwright@1.65.0 run-server --host 127.0.0.1 --port 3002'
      - name: Real submission, upload and approval in Chromium and WebKit
        run: node --env-file="$RUNNER_TEMP/lumen-staging.env" scripts/staging/run-browser-tests.mjs
      - name: Store screenshots only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: disposable-staging-screenshots
          path: test-results/staging-*/**/*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Destroy disposable staging
        if: always()
        run: |
          docker rm --force lumen-staging-browsers || true
          supabase stop --workdir "$RUNNER_TEMP/lumen-staging" --no-backup || true
          rm -f "$RUNNER_TEMP/lumen-staging.env" "$RUNNER_TEMP/lumen-staging-start.log"
